<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Agências</title>

<style>

:root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1f2937;
    --border:#d1d5db;
    --primary:#2563eb;
}

.dark{
    --bg:#111827;
    --card:#1f2937;
    --text:#f9fafb;
    --border:#374151;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1,h2{
    margin-top:0;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-top:10px;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid var(--border);
    box-sizing:border-box;
}

button{
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    margin:2px;
}

.primary{
    background:#2563eb;
    color:white;
}

.success{
    background:#16a34a;
    color:white;
}

.danger{
    background:#dc2626;
    color:white;
}

.secondary{
    background:#6b7280;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:10px;
}

.actions{
    margin-top:10px;
}

.small{
    font-size:13px;
    color:gray;
}


</style>
</head>

<body class="dark">

<div class="container">

<h1>Consulta de Agências</h1>

<button class="success" onclick="alternarTema()">
🌙 Claro / Escuro
</button>

<div class="card">

<h2>Pesquisar</h2>

<input
id="pesquisa"
placeholder="Digite Agência, MCU, STO ou Agência..."
oninput="this.value=this.value.toUpperCase(); pesquisar();"
autofocus>

<button class="secondary" onclick="limparResultado()">
🧹 Limpar Resultado
</button>

</div>

<div id="resultado"></div>

<div class="card">

<h2>Backup</h2>

<button class="primary" onclick="exportarDados()">
Exportar JSON
</button>

<button class="success" onclick="irParaPesquisa()">
⬆️ Pesquisa
</button>

<button class="danger"
onclick="localStorage.clear();location.reload();">
Limpar Base
</button>

<input
type="file"
id="arquivoImportacao"
accept=".xlsx,.xls"
onchange="importarDados()">

</div>

<!-- Biblioteca para ler Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>

let agencias = JSON.parse(localStorage.getItem("agencias")) || [

{
agencia:"AC GARAVELO",
mcu:"54341",
sto:"16303750",
reate:"REATE01",
cav:"CAV4"
},

{
agencia:"AC URIAS MAGALHAES",
mcu:"55339",
sto:"16303822",
reate:"REATE01",
cav:"CAV2"
},

{
agencia:"AC TURVELANDIA",
mcu:"6884",
sto:"16302940",
reate:"REATE03",
cav:"CAV1"
},

{
agencia:"AC ALOANDIA",
mcu:"6714",
sto:"16301196",
reate:"REATE02",
cav:"CAV4"
},

{
agencia:"AC ARENOPOLIS",
mcu:"6828",
sto:"16302371",
reate:"REATE03",
cav:"CAV3"
}

];


function salvarLocal(){

    localStorage.setItem(
        "agencias",
        JSON.stringify(agencias)
    );

    pesquisar();

}

function limparResultado(){
    document.getElementById("resultado").innerHTML = "";
    document.getElementById("pesquisa").value = "";
}

function atualizarAutoComplete(){

    let lista=document.getElementById("listaAgencias");
    lista.innerHTML="";

    agencias.forEach(item=>{

        let op=document.createElement("option");
        op.value=item.agencia;
        lista.appendChild(op);

    });
}

function irParaPesquisa(){
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    document.getElementById("pesquisa").focus();
}


function formatarCodigo(valor){

    valor = String(valor || "").trim();

    return valor.padStart(8, "0");

}

function pesquisar(){

    let termo =
        document.getElementById("pesquisa")
        .value
        .trim()
        .toUpperCase();

    if(termo === ""){
        document.getElementById("resultado").innerHTML = "";
        return;
    }

    let dados = agencias.filter(registro => {

        let texto = Object.values(registro)
            .join(" ")
            .toUpperCase();

        return texto.includes(termo);

    });

    let html = "";

    dados.forEach(item => {

    html += `
    <div class="card">

        <h3>${item.agencia || item.AGENCIA || "Agência"}</h3>

        MCU: ${formatarCodigo(item.mcu || item.MCU || "")}
<button class="primary"
onclick="navigator.clipboard.writeText(formatarCodigo('${item.mcu || item.MCU || ""}'))">
Copiar
</button>
<br>

STO: ${formatarCodigo(item.sto || item.STO || "")}
<button class="primary"
onclick="navigator.clipboard.writeText(formatarCodigo('${item.sto || item.STO || ""}'))">
Copiar
</button>
<br><br>
        REATE: ${(item.reate || item.REATE || "").replace("REATE","")}<br>
	CAT: ${item.cat || item.CAT || ""}<br>
	CVE: ${item.cve || item.CVE || ""}<br>
        
    </div>
    `;

});

    document.getElementById("resultado").innerHTML = html;
}


function exportarDados(){

    let blob=new Blob(
    [JSON.stringify(agencias,null,2)],
    {type:'application/json'}
    );

    let a=document.createElement("a");

    a.href=URL.createObjectURL(blob);
    a.download="agencias_backup.json";
    a.click();
}

function importarDados(){

    const arquivo =
        document.getElementById("arquivoImportacao").files[0];

    if(!arquivo) return;

    const leitor = new FileReader();

    leitor.onload = function(e){

        const dados = new Uint8Array(e.target.result);

        const workbook = XLSX.read(
            dados,
            { type: "array" }
        );

      // Mostra as abas
alert(workbook.SheetNames.join("\n"));

// Força usar a aba CAV
const nomePlanilha = "CAV";

const sheet = workbook.Sheets[nomePlanilha];

const linhas = XLSX.utils.sheet_to_json(sheet);

// Mostra a primeira linha completa
alert(JSON.stringify(linhas[0], null, 2));

agencias = [];

linhas.forEach(linha => {

    agencias.push({

        agencia: String(linha["AGENCIA"] || "").trim(),

        mcu: String(linha["MCU"] || "").trim(),

        sto: String(linha["STO"] || "").trim(),

        reate: String(linha["REATE"] || "").trim(),

        cat: String(linha["CAT"] || "").trim(),

        cve: String(linha["CVE"] || "").trim()

    });

});

        salvarLocal();

        alert(
            agencias.length +
            " registros importados com sucesso!"
        );

    };

    leitor.readAsArrayBuffer(arquivo);

}
function alternarTema(){
    document.body.classList.toggle("dark");
}

window.onload = function(){

    window.scrollTo(0,0);

    document.getElementById("pesquisa").focus();

    pesquisar();

};

</script>

</body>
</html>
